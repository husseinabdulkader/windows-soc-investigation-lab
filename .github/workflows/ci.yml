name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate synthetic dataset
        run: python analyze.py data/authentication.csv --validate-only
      - name: Test detection and evidence
        run: python -m unittest discover -s tests -v
      - name: Validate group events and approvals
        run: python group_changes.py data/group-events.json data/group-approvals.json --validate-only
